<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC demo – chip-opslag</title>
<style>
  :root {
    --bg: #f3f5f2; --kort: #ffffff; --tekst: #1d2420; --svag: #5f6b64;
    --ok: #1f7a3a; --ok-bg: #e3f3e7; --ukendt: #8a5a00; --ukendt-bg: #fff3d9;
    --fejl: #b3261e; --fejl-bg: #fde7e5; --linje: #e2e7e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--tekst);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.45;
  }
  main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  header svg { width: 34px; height: 34px; }
  header h1 { font-size: 22px; margin: 0; }
  .kort {
    background: var(--kort); border-radius: 16px; padding: 18px 18px 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px;
  }
  .status { border-radius: 16px; padding: 18px; margin-bottom: 14px; }
  .status .ikon { font-size: 34px; line-height: 1; }
  .status h2 { margin: 8px 0 4px; font-size: 22px; }
  .status p { margin: 0; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .ukendt { background: var(--ukendt-bg); color: var(--ukendt); }
  .fejl { background: var(--fejl-bg); color: var(--fejl); }
  .vent { background: var(--kort); color: var(--svag); }
  .uid { font-family: ui-monospace, Consolas, monospace; font-size: 18px; word-break: break-all; }
  dl { margin: 0; }
  .raekke { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linje); }
  .raekke:first-child { border-top: 0; }
  dt { width: 42%; color: var(--svag); flex-shrink: 0; }
  dd { margin: 0; flex: 1; word-break: break-word; }
  .note { font-size: 14px; color: var(--svag); padding: 4px 4px 0; }
  .note b { color: var(--tekst); }
  .skjult { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1f7a3a" d="M20 2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 18H4V4h16v16zM18 6h-5c-1.1 0-2 .9-2 2v2.28c-.6.35-1 .98-1 1.72 0 1.1.9 2 2 2s2-.9 2-2c0-.74-.4-1.38-1-1.72V8h3v8H8V8h2V6H6v12h12V6z"/></svg>
    <h1>NFC demo</h1>
  </header>

  <section id="status" class="status vent">
    <div class="ikon">⏳</div>
    <h2>Slår chippen op…</h2>
    <p class="uid" id="statusUid"></p>
  </section>

  <section id="data" class="kort skjult">
    <dl id="felter"></dl>
  </section>

  <p class="note">
    <b>Demo:</b> Chippens ID står direkte i URL'en og kan kopieres til en anden chip.
    Ægte kopisikring kræver en chip som NTAG 424 DNA, der laver en ny krypteret kode ved hver scanning.
  </p>
</main>

<script>
  // ---- Indstillinger: tjek mod config.json fra Windows-demoen ----
  const SUPABASE_URL = "https://yctucjpdhpxyhsdxrxow.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_qTQTBe4enPihWMrL8PnaUA_ZtiRAyvM";
  // Kun publishable key her - ALDRIG secret key (sb_secret_...).

  const $ = (id) => document.getElementById(id);

  function visStatus(klasse, ikon, titel, tekst) {
    const s = $("status");
    s.className = "status " + klasse;
    s.querySelector(".ikon").textContent = ikon;
    s.querySelector("h2").textContent = titel;
    $("statusUid").textContent = tekst || "";
  }

  function datoTid(v) {
    if (!v) return "–";
    const d = new Date(v);
    if (isNaN(d)) return v;
    return d.toLocaleString("da-DK", { dateStyle: "medium", timeStyle: "short" });
  }

  function visFelter(par) {
    const dl = $("felter");
    dl.replaceChildren();
    for (const [navn, vaerdi] of par) {
      const r = document.createElement("div");
      r.className = "raekke";
      const dt = document.createElement("dt");
      dt.textContent = navn;
      const dd = document.createElement("dd");
      dd.textContent = vaerdi;
      r.append(dt, dd);
      dl.append(r);
    }
    $("data").classList.remove("skjult");
  }

  async function slaaOp() {
    const id = new URLSearchParams(location.search).get("id");
    if (!id) {
      visStatus("fejl", "⚠️", "Intet chip-ID", "URL'en mangler ?id=…");
      return;
    }
    $("statusUid").textContent = id;

    try {
      const svar = await fetch(SUPABASE_URL + "/rest/v1/rpc/chip_opslag", {
        method: "POST",
        headers: { "apikey": PUBLISHABLE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ p_id: id, p_browser: navigator.userAgent }),
      });
      const d = await svar.json();
      if (!svar.ok) throw new Error(d.message || ("HTTP " + svar.status));

      if (d.fejl) {
        visStatus("fejl", "⚠️", d.fejl, id);
        return;
      }
      if (!d.fundet) {
        visStatus("ukendt", "❔", "Ukendt chip", d.uid);
        visFelter([
          ["Status", "Ikke registreret i databasen"],
          ["Web-scanninger", String(d.web_scanninger ?? "–")],
        ]);
        return;
      }

      visStatus("ok", "✅", "Registreret chip", d.uid);
      visFelter([
        ["Chiptype", d.chiptype || "–"],
        ["Beskrivelse", d.beskrivelse || "–"],
        ["Første scanning", datoTid(d.foerste_scanning)],
        ["Sidst opdateret", datoTid(d.sidst_opdateret)],
        ["Web-scanninger", String(d.web_scanninger ?? "–")],
      ]);
    } catch (e) {
      visStatus("fejl", "⚠️", "Opslaget fejlede", String(e.message || e));
    }
  }

  slaaOp();
</script>
</body>
</html>
